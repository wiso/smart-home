- id: '1750283268908'
  alias: Cambia modalità suoneria telefono
  description: ''
  triggers:
  - entity_id:
    - input_select.ring_mode_oneplusnord2
    trigger: state
  actions:
  - action: notify.mobile_app_oneplusnord2
    data:
      message: command_ringer_mode
      data:
        command: "{% if is_state('input_select.ring_mode_oneplusnord2', 'Normale')
          %}\n  normal\n{% elif is_state('input_select.ring_mode_oneplusnord2', 'Vibrazione')
          %}\n  vibrate\n{% elif is_state('input_select.ring_mode_oneplusnord2', 'Silenzioso')
          %}\n  silent\n{% endif %}\n"
  - delay:
      hours: 0
      minutes: 0
      seconds: 3
      milliseconds: 0
  - choose:
    - conditions:
      - condition: state
        entity_id: sensor.oneplusnord2_ringer_mode
        state: normal
      sequence:
      - action: input_select.select_option
        metadata: {}
        data:
          option: Normale
        target:
          entity_id: input_select.ring_mode_oneplusnord2
    - conditions:
      - condition: state
        entity_id: sensor.oneplusnord2_ringer_mode
        state: silent
      sequence:
      - action: input_select.select_option
        metadata: {}
        data:
          option: Silenzioso
        target:
          entity_id: input_select.ring_mode_oneplusnord2
    - conditions:
      - condition: state
        entity_id: sensor.oneplusnord2_ringer_mode
        state: vibrate
      sequence:
      - action: input_select.select_option
        metadata: {}
        data:
          option: Vibrazione
        target:
          entity_id: input_select.ring_mode_oneplusnord2
  mode: single
