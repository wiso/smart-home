- id: '1701897453015'
  alias: Lavatrice finito
  description: ''
  use_blueprint:
    path: sbyx/notify-or-do-something-when-an-appliance-like-a-dishwasher-or-washing-machine-finishes.yaml
    input:
      power_sensor: sensor.presalavatrice_power
      actions:
      - variables:
          stop_energy: '{{ states(''sensor.presalavatrice_energy'') |float }}'
      - data:
          message: Lavatrice finito, energy = {{ stop_energy - start_energy }} kWh
        action: notify.persistent_notification
      - action: counter.increment
        target:
          entity_id: counter.lavatrice_cicli
      - action: input_number.set_value
        target:
          entity_id: input_number.lavatrice_ultimo_consumo
        data:
          value: '{{ (stop_energy - start_energy) | round(3) }}'
      - action: input_number.set_value
        target:
          entity_id: input_number.lavatrice_ultima_durata
        data:
          value: '{{ ((now().timestamp() - (start_ts | float)) / 60) | round(0) }}'
      pre_actions:
      - variables:
          start_energy: '{{ states(''sensor.presalavatrice_energy'') |float }}'
          start_ts: '{{ now().timestamp() }}'
      - data:
          message: Lavatrice iniziato
        action: notify.persistent_notification
