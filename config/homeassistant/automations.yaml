- id: '1785166706095'
  alias: t3bench alerts to phone
  description: Receives Grafana alert webhooks from the t3bench Tier3 benchmark (Grafana
    runs on this same host) and forwards them as a phone notification. Payload fields
    come from Grafana's default webhook body.
  triggers:
  - trigger: webhook
    webhook_id: t3bench-alerts-9f2c71a4
    allowed_methods:
    - POST
    local_only: true
    note: Called by the Grafana contact point 't3bench-ha'. local_only keeps it reachable
      from the LAN/docker only.
  actions:
  - action: notify.mobile_app_oneplusnord2
    data:
      title: '{{ trigger.json.title | default(''t3bench alert'', true) }}'
      message: '{{ trigger.json.message | default(''(no message)'', true) | truncate(500)
        }}'
      data:
        url: http://192.168.1.140:3000/alerting/list
        tag: t3bench-alert
    note: Templates only build the notification text; the url opens Grafana's alert
      list.
  mode: queued
  max: 10
- id: '1785323987981'
  alias: SolarEdge data stale
  description: Fires when the SolarEdge integration stops reporting. sensor.solaredge_data_age
    counts minutes since sensor.solaredge_power_consumption last wrote anything; consumption
    shares the power-flow coordinator with solar power, so the two freeze together.
    Normal cadence is a poll every 15 minutes, so 45 means three missed polls. During
    a freeze the entities keep showing their last value instead of going unavailable,
    which silently corrupts energy statistics in both directions.
  triggers:
  - trigger: numeric_state
    entity_id: sensor.solaredge_data_age
    above: 45
    id: stale
  - trigger: numeric_state
    entity_id: sensor.solaredge_data_age
    below: 45
    id: recovered
  actions:
  - choose:
    - alias: Raise the alarm
      conditions:
      - condition: trigger
        id: stale
      sequence:
      - action: persistent_notification.create
        data:
          notification_id: solaredge_stale
          title: SolarEdge data stale
          message: No update from the SolarEdge integration for {{ states('sensor.solaredge_data_age')
            }} minutes. Solar power is frozen at {{ states('sensor.solaredge_solar_power')
            }} kW and consumption at {{ states('sensor.solaredge_power_consumption')
            }} kW; both are stale, not real. Energy statistics recorded during this
            window will be wrong.
      - action: notify.mobile_app_oneplusnord2
        data:
          title: SolarEdge data stale
          message: No update for {{ states('sensor.solaredge_data_age') }} minutes.
            Readings are frozen.
    - alias: Clear the alarm on recovery
      conditions:
      - condition: trigger
        id: recovered
      sequence:
      - action: persistent_notification.dismiss
        data:
          notification_id: solaredge_stale
  mode: single
