    e invia una notifica sul telefono e su Home Assistant.
  triggers:
  - entity_id:
    - switch.irrigatore_balcone_cucina
    to:
    - 'on'
    for:
      hours: 0
      minutes: 15
      seconds: 0
    trigger: state
  conditions: []
  actions:
  - action: switch.turn_off
    data: {}
    target:
      entity_id: switch.irrigatore_balcone_cucina
  - data:
      message: Non hai spento irrigatore dopo 15 minuti cucina!
    action: persistent_notification.create
  - action: notify.mobile_app_oneplusnord2
    metadata: {}
    data:
      message: NON HAI SPENTO L'ACQUA BALCONE CUCINA
  mode: single
